{% set name = "rfc3987" %}
{% set version = "1.3.8" %}
{% set file_ext = "tar.gz" %}
{% set hash_type = "sha256" %}
{% set hash_value = "d3c4d257a560d544e9826b38bc81db676890c79ab9d7ac92b39c7a253d5ca733" %}

package:
  name: '{{ name|lower }}'
  version: '{{ version }}'

source:
  fn: '{{ name }}-{{ version }}.{{ file_ext }}'
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.{{ file_ext }}
  '{{ hash_type }}': '{{ hash_value }}'

build:
  noarch: python
  skip: True # [not linux64]
  number: 0
  script: python -m pip install . --no-deps --ignore-installed --no-build-isolation 

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  build:
    - python
  run:
    - python

test:
  imports: "{{ name }}"
  requires:
    - pip
  commands:
    - pip check


about:
  home: https://pypi.org/project/rfc3987/
  license: 'GPL-3.0-or-later'
  license_family: GPL3
  license_file: 'COPYING.txt'
  summary: Parsing and validation of URIs (RFC 3986) and IRIs (RFC 3987)
  description: This module provides regular expressions according to RFC 3986 and RFC 3987
  doc_url: https://github.com/dgerber/rfc3987
  dev_url: https://github.com/dgerber/rfc3987

extra:
  skip-lints:
    - avoid_noarch
    - host_section_needs_exact_pinnings

  anaconda-services:
    ref: https://anaconda.zendesk.com/agent/tickets/66289
    reason: needed for flex-swagger->prance
    recipe-maintainers:
       - bkreider

  recipe-maintainers:
    - RohitK89
    - mariusvniekerk
